[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "inksight"
version = "0.2.0"
description = "Class-based Python wrapper around Google Research's InkSight handwriting derendering model (Mitrevski et al., TMLR 2025), model included."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
# Run the model in this environment (versions follow the official notebook).
# tensorflow-text has no Windows wheels after 2.10; there the graph's tokenizer
# ops are swapped for the sentencepiece package instead (see README).
tf = [
    "tensorflow==2.20.0; python_version < '3.14'",
    "tensorflow-text==2.20.1; sys_platform != 'win32' and python_version < '3.14'",
    "sentencepiece>=0.2.1",
]
# Word detectors for full pages (pick one or more).
doctr = ["python-doctr>=1.0"]                                   # the notebook's engine (PyTorch build)
paddle = ["paddlepaddle>=3.0", "paddleocr>=3.0"]                 # newer: PP-OCR
tesseract = ["pytesseract>=0.3.13"]                              # also needs the tesseract program
all = ["inksight[tf,doctr,paddle,tesseract]"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
inksight = "inksight.__main__:main"
inksight-model = "inksight.worker:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The compressed model and the Docker build glue travel with the package, so
# the model runs - locally or in a container - from an installed copy.
inksight = [
    "docker/*",
    "scripts/*",
    "vendor/*.md",
    "vendor/model/*",
    "vendor/examples/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "model: runs the InkSight model (TensorFlow here, or Docker)",
    "ocr: needs an optional OCR engine (docTR, PaddleOCR or Tesseract)",
]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "inksight-api"
version = "0.1.0"
description = "Object-oriented, extensible Python API around Google Research's InkSight handwriting derendering model"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
# Rendering, animation and the 3-panel page figure.
viz = ["matplotlib>=3.6"]
# TensorFlow runtime for the released Small-p checkpoint (versions follow the
# official notebook). tensorflow-text has no Windows wheels after 2.10, so it is
# skipped there; see README "Windows" for what that means.
# For a GPU install on Linux use:  pip install "tensorflow[and-cuda]==2.20.0"
tf = [
    "tensorflow==2.20.0",
    "tensorflow-text==2.20.1; sys_platform != 'win32'",
    "sentencepiece>=0.2.1",
]
# Only for loading from the Hugging Face Hub instead of a zip / folder.
hub = ["huggingface_hub>=0.23", "tf-keras==2.20.1"]
# Word segmentors for full-page conversion (pick one or both).
tesseract = ["pytesseract>=0.3.13"]          # also needs the `tesseract-ocr` system package
doctr = ["python-doctr[tf]==0.10.0"]
all = ["inksight-api[viz,tf,hub,tesseract,doctr]"]
dev = ["pytest>=7", "matplotlib>=3.6"]

[project.scripts]
inksight = "inksight_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inksight_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
